name: Check

# Pre-release: cheap correctness checks on every push to main. No image is built here;
# that is test-build.yml and runs only for v* tags or on demand.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # main is the only branch. A newer push must not hide a failure by cancelling its run.
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'resources/**'
              - 'tests/**'

  web:
    name: brand + portal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression evidence cannot silently pass missing coverage
        run: python -m unittest discover -s scripts -p test_regression.py -v
      - name: Operating records are valid
        run: python .ai/machine/organize.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Brand sources are valid and generated files are current
        run: |
          node scripts/brand-sync.mjs --check
          node --test scripts/brand-sync.test.mjs
      - name: Every /api route is documented
        run: node scripts/check-api-coverage.mjs
      - name: The UI touches the network only at its edge
        run: node scripts/check-dumb-ui.mjs
      - name: Host deploy scripts behave (fake docker)
        run: |
          bash deploy/install.test.sh
          bash deploy/update.test.sh
          bash deploy/auto-update.test.sh
          bash deploy/backup.test.sh
          bash deploy/relay.test.sh
          bash deploy/host.test.sh
      - name: Both database profiles select the intended services
        shell: bash
        run: |
          for backend in postgres foundationdb; do
            services=$(COMPOSE_PROFILES="bundled,$backend" docker compose --env-file deploy/server.env.example -f deploy/compose.yaml config --services)
            grep -qx "$backend" <<< "$services"
            other=foundationdb; [[ "$backend" == foundationdb ]] && other=postgres
            if grep -qx "$other" <<< "$services"; then echo 'Both databases were selected'; exit 1; fi
          done
      - run: npm ci
        working-directory: ui
      - run: node scripts/check-webui-inventory.mjs
        working-directory: ui
      - name: MCPL conformance
        run: node scripts/check-mcpl.mjs
        working-directory: ui
      - name: Registry contracts match the server schema
        run: npm run registry:check
        working-directory: ui
      - name: Biome (format and lint)
        run: npm run lint
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: Browser tests (mocked engine)
        working-directory: ui
        run: |
          # The runner image already carries Chrome's system libraries. When Ubuntu's package
          # mirror cannot be reached, install the browser alone instead of failing the run.
          npx playwright install --with-deps chromium || {
            echo "::warning::System packages could not be installed; using the runner image's own."
            npx playwright install chromium
          }
          npx playwright test

  rust:
    name: cargo check
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler clang cmake libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (same feature set as the image)
        run: cargo check -p shippin-tech --no-default-features --features "sqlite postgres mysql rocks s3 redis azure nats enterprise"
      - name: Install defect runtime regressions
        run: cargo test -p common --locked --lib install_defects
      - name: Short-name authentication and account isolation
        env:
          STORE: Sqlite
          shippin.tech_KEEP_DELETED_DAYS: '0'
        run: cargo test -p tests --locked --no-default-features --features sqlite install_defects_short_names -- --nocapture
      - name: System domain and root administrator separation
        env:
          STORE: Sqlite
        run: |
          cargo test -p common --locked --lib system_domain
          cargo test -p tests --locked --no-default-features --features sqlite system_domain -- --nocapture
      - name: PostgreSQL bootstrap and administrator lifecycle
        env:
          STORE: PostgreSql
          shippin.tech_KEEP_DELETED_DAYS: '0'
          RUST_MIN_STACK: '16777216'
        run: cargo test -p tests --locked --no-default-features --features sqlite,postgres system::authentication -- --nocapture --test-threads=1

  # Pre-release there are no pull requests: main takes every change and this run is the gate.
  # A red run is loud (annotation, summary, the pusher's failure email) and is fixed forward on main.
  verdict:
    name: main verdict
    needs: [web, rust]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        run: |
          web='${{ needs.web.result }}'; rust='${{ needs.rust.result }}'
          echo "### Check on ${GITHUB_SHA::7}: web=$web rust=$rust" >> "$GITHUB_STEP_SUMMARY"
          if [ "$web" != success ] || { [ "$rust" != success ] && [ "$rust" != skipped ]; }; then
            echo "::error title=main is red::Check failed on ${GITHUB_SHA::7} (web=$web, rust=$rust). Fix forward on main."
            exit 1
          fi

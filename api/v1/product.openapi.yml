openapi: 3.0.3
info:
  title: shippin.tech Product API
  description: 'Our own HTTP API under `/api/v1`. It covers first-run setup,
    the free plan, organisations, SSO, SCIM, recovery, alerts, masked addresses, keys, AI settings, the
    assistant, lessons, the Google Drive link, MCP, statistics and traces. The sign-in, discovery, schema and telemetry routes (`/api/v1/auth`,
    `/api/v1/discover`, `/api/v1/account`, `/api/v1/schema`, `/api/v1/token/*`, `/api/v1/live/*`) are in `api/v1/engine.openapi.yml`.


    Pre-release. Each operation names who may call it in `x-auth`, read from the handler, and the automated
    test that exercises it in `x-proof` where one exists. `x-unverified: true` marks something not confirmed
    from the code. Nothing here takes a key in a URL; secret fields are `writeOnly`.'
  version: '1.0'
  x-license-note: see LICENSE and RELEASE.md C1
servers:
- url: https://{host}
  description: shippin.tech server
  variables:
    host:
      default: mail.example.com
      description: The hostname of the server
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Product
- name: Setup
- name: Operations
- name: Tracing
- name: Assistant
- name: Keys
- name: MCP
- name: SCIM
- name: SSO
- name: Calendar templates
- name: Brand
- name: Organisations
- name: Organisation panel
- name: Masked addresses
- name: Recovery
- name: Alerts
- name: Google link
- name: Lessons
- name: Free plan
paths:
  /api:
    get:
      operationId: productIndex
      summary: What this server offers, by product area
      tags:
      - Product
      description: 'The same document as `resources/product/api.json`: each area with its web page, endpoints
        and an honest status (live, partial or planned).'
      x-auth: 'Public: no sign-in.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDocument'
  /api/v1/product:
    get:
      operationId: productIndexAlias
      summary: Same as GET /api
      tags:
      - Product
      x-auth: 'Public: no sign-in.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDocument'
  /api/v1/setup:
    get:
      operationId: setupStatus
      summary: Is first-run setup still pending?
      tags:
      - Setup
      x-auth: 'Not checked in code: this branch does not sign the caller in.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: boolean
                  administrator:
                    type: string
                    const: root@system.local
                required:
                - pending
      x-proof: ui/e2e-live/first-run.spec.ts
  /api/v1/setup/admin:
    post:
      operationId: setupAdmin
      summary: Turn the printed setup key into the first administrator
      tags:
      - Setup
      description: Creates root@system.local in the reserved bootstrap identity domain and
        retires the setup key for good. Does not create a hosted mail domain. The administrator
        uses WebAdmin/API access; mail-protocol use is disabled. Fails with 409 `done` once setup is complete.
      x-auth: Signed in as the setup account (`admin` with the one-time setup key). Any other account
        gets 403 notSetup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  writeOnly: true
              required:
              - password
              additionalProperties: false
      responses:
        '200':
          description: The administrator was created and the setup key retired
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                required:
                - email
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/first-run.spec.ts
      x-errors:
      - invalidRequest
      - weakPassword
      - adminRejected
      - notSetup
      - done
  /api/v1/resources:
    get:
      operationId: resources
      summary: Server gauges and what each organisation uses
      tags:
      - Operations
      x-auth: Permissions `liveMetrics` and `sysAccountGet`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resources'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/resources.spec.ts
  /api/v1/stats:
    get:
      operationId: stats
      summary: Dashboard statistics from the server's own sampler
      tags:
      - Operations
      description: Counters are sampled into hourly and daily totals every minute. Use `period`, or `from`
        and `to` together.
      x-auth: Permission `liveMetrics`.
      parameters:
      - name: period
        in: query
        required: false
        description: One of 24h, 7d, 30d, 90d. Default 24h.
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          - 90d
      - name: from
        in: query
        required: false
        description: Start, seconds since 1970. Needs `to`.
        schema:
          type: integer
      - name: to
        in: query
        required: false
        description: End, seconds since 1970. Needs `from`.
        schema:
          type: integer
      - name: node
        in: query
        required: false
        description: A node id (an integer), or `all`.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '400':
          description: 'invalidRange: bad period, from/to, or node'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/dashboard.spec.ts
  /api/v1/trace/token:
    get:
      operationId: traceToken
      summary: A 60-second token for the live trace stream
      tags:
      - Tracing
      x-auth: Permission `liveTracing`.
      responses:
        '200':
          description: The token as plain text
          content:
            text/plain:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/tracing.spec.ts
  /api/v1/trace/live:
    get:
      operationId: traceLive
      summary: Stream the server's events (server-sent events)
      tags:
      - Tracing
      x-auth: The token from `/api/v1/trace/token`, passed as `?token=` (no Authorization header is read).
      security:
      - liveToken: []
      parameters:
      - name: token
        in: query
        required: false
        description: Token from /api/v1/trace/token.
        schema:
          type: string
      - name: level
        in: query
        required: false
        description: trace, debug, info, warn or error. Default debug.
        schema:
          type: string
      - name: filter
        in: query
        required: false
        description: A word to find in the event name or any value.
        schema:
          type: string
      - name: '{key}'
        in: query
        required: false
        description: Any other `key=value` pair filters on an event key such as accountName or remoteIp.
        schema:
          type: string
      responses:
        '200':
          description: 'Server-sent events: `ready` once, then `trace` events carrying arrays of event
            objects; `: keepalive` comments in between.'
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: invalidFilter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: noToken, or an invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-proof: ui/e2e-live/tracing.spec.ts
  /api/v1/trace/history:
    get:
      operationId: traceHistory
      summary: Search stored traces
      tags:
      - Tracing
      x-auth: Permission `liveTracing`.
      parameters:
      - name: q
        in: query
        required: false
        description: Search text.
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: Trace kind filter.
        schema:
          type: string
      - name: problems
        in: query
        required: false
        description: '`1` to list only traces with problems.'
        schema:
          type: string
      - name: before
        in: query
        required: false
        description: Return traces before this value (paging).
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: 1 to 500, default 100.
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  traces:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required:
                - traces
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/tracing.spec.ts
      x-unverified-fields: The shape of each trace object is built by list_traces and was not read in
        full.
  /api/v1/trace/history/{id}:
    get:
      operationId: traceHistoryOne
      summary: The events of one stored trace
      tags:
      - Tracing
      x-auth: Permission `liveTracing`.
      parameters:
      - name: id
        in: path
        required: true
        description: Trace id.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required:
                - events
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'notFound: the trace is no longer kept'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/tracing.spec.ts
  /api/v1/assistant:
    get:
      operationId: assistantStatus
      summary: Is the assistant turned on?
      tags:
      - Assistant
      x-auth: Any signed-in account.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                required:
                - enabled
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/assistant.spec.ts
    post:
      operationId: assistantAsk
      summary: Ask the assistant a question about the product
      tags:
      - Assistant
      description: 'Answers from this product''s own descriptions and lessons, fitted to the person''s
        role (admin, owner or user). It has no tools: it cannot read mail or change anything. Conversations
        are not stored.'
      x-auth: 'Any signed-in account. Rate limit: 40 questions per hour per account.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  maxItems: 12
                  description: Alternating turns starting with `user`; each content up to 4000 characters.
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                        - user
                        - assistant
                      content:
                        type: string
                    required:
                    - role
                    - content
                page:
                  type: string
                  description: The screen the person is on.
              required:
              - messages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                required:
                - answer
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: 'off: the assistant is turned off'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: tooMany
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 'unavailable: the AI service did not answer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/assistant.spec.ts
  /api/v1/ai/settings:
    get:
      operationId: aiSettingsGet
      summary: Read the AI service settings (the key is never returned)
      tags:
      - Assistant
      x-auth: Server administrators only (the account is checked with is_server_admin; anyone else gets
        403 notAdmin).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    nullable: true
                  endpoint:
                    type: string
                    nullable: true
                  model:
                    type: string
                    nullable: true
                  hasKey:
                    type: boolean
                  assistant:
                    type: boolean
        '403':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/assistant.spec.ts
    post:
      operationId: aiSettingsSave
      summary: Save the AI service settings
      tags:
      - Assistant
      description: '`key` is write-only: it is sealed on the server and never returned. Paste it into
        this field; never put it in a URL.'
      x-auth: Server administrators only (the account is checked with is_server_admin; anyone else gets
        403 notAdmin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                endpoint:
                  type: string
                model:
                  type: string
                key:
                  type: string
                  format: password
                  writeOnly: true
                assistant:
                  type: boolean
                  description: Turn the assistant on.
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/assistant.spec.ts
    delete:
      operationId: aiSettingsRemove
      summary: Remove the AI service settings
      tags:
      - Assistant
      x-auth: Server administrators only (the account is checked with is_server_admin; anyone else gets
        403 notAdmin).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: boolean
        '403':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/assistant.spec.ts
  /api/v1/ai/test:
    post:
      operationId: aiTest
      summary: Check that the saved AI service answers
      tags:
      - Assistant
      x-auth: Server administrators only (the account is checked with is_server_admin; anyone else gets
        403 notAdmin).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          description: 'none: save the settings first'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/assistant.spec.ts
  /api/v1/keys:
    get:
      operationId: keysList
      summary: Each service's keys, without their bytes
      tags:
      - Keys
      x-auth: Server administrators only (the account is checked with is_server_admin; anyone else gets
        403 notAdmin).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        service:
                          type: string
                        keys:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                  wrapping:
                    type: object
                    properties:
                      path:
                        type: string
                      madeHere:
                        type: boolean
                      readable:
                        type: boolean
        '403':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/keys.spec.ts
      x-unverified-fields: The shape of each key description comes from keys::describe and was not read
        in full.
  /api/v1/keys/author:
    post:
      operationId: keysAuthor
      summary: Make the keys a new server still lacks
      tags:
      - Keys
      x-auth: Server administrators only (the account is checked with is_server_admin; anyone else gets
        403 notAdmin).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  made:
                    type: array
                    items:
                      type: string
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          description: keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/keys.spec.ts
  /api/v1/keys/{service}/replace:
    post:
      operationId: keysReplace
      summary: Replace one service's key
      tags:
      - Keys
      description: 'Where the new key comes from: random, pasted, an environment variable name, or a file
        path. A pasted value is write-only.'
      x-auth: Server administrators only (the account is checked with is_server_admin; anyone else gets
        403 notAdmin).
      parameters:
      - name: service
        in: path
        required: true
        description: A service name as listed by GET /api/v1/keys.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  from:
                    type: string
                    enum:
                    - random
              - type: object
                properties:
                  from:
                    type: string
                    enum:
                    - value
                  value:
                    type: string
                    format: byte
                    writeOnly: true
                    description: Base64 key bytes.
                required:
                - from
                - value
              - type: object
                properties:
                  from:
                    type: string
                    enum:
                    - environmentVariable
                  name:
                    type: string
                    maxLength: 128
                required:
                - from
                - name
              - type: object
                properties:
                  from:
                    type: string
                    enum:
                    - file
                  path:
                    type: string
                    description: Absolute path starting with /.
                required:
                - from
                - path
      responses:
        '200':
          description: Replaced; the service's values were sealed again under the new key before the old
            one was destroyed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: unknownService
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/keys.spec.ts
  /api/v1/mcp:
    post:
      operationId: mcp
      summary: MCP server (JSON-RPC over Streamable HTTP)
      tags:
      - MCP
      description: 'Speaks MCP 2026-07-28 (stateless: version and capabilities in `_meta`, mirrored in
        the Streamable HTTP headers) and the initialize-based 2025-11-25, 2025-06-18 and 2025-03-26. Tools
        are the actions screens declare (`resources/product/actions.json`). A call goes to the operator''s
        open admin panel; nothing runs behind their back, writes ask first, and no tool takes a key. With
        no admin panel open the agent is told why nothing happened. Other methods get 405.'
      x-auth: Server administrators only (the account is checked with is_server_admin; anyone else gets
        403 notAdmin). Origin must match the host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: A JSON-RPC response, or a server-sent event stream while the operator decides on
            a tool call that writes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        '400':
          description: JSON-RPC parse error (-32700) or a bad protocol header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Origin not allowed, or not an administrator (JSON-RPC -32600)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: Method not allowed
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/mcp.spec.ts
  /api/v1/mcp/viewport/token:
    post:
      operationId: mcpViewportToken
      summary: A 60-second token for the screen to open its stream
      tags:
      - MCP
      x-auth: Server administrators only (the account is checked with is_server_admin; anyone else gets
        403 notAdmin).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                required:
                - token
        '403':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/mcp.spec.ts
  /api/v1/mcp/viewport/stream:
    get:
      operationId: mcpViewportStream
      summary: The calls waiting for the operator's screen (server-sent events)
      tags:
      - MCP
      x-auth: The single-use token from /api/v1/mcp/viewport/token, as `?token=`.
      security:
      - liveToken: []
      parameters:
      - name: token
        in: query
        required: false
        description: Single-use token.
        schema:
          type: string
      responses:
        '200':
          description: 'Server-sent events: `ready` with the viewport id, then calls; keepalive comments
            in between'
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: noToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-proof: ui/e2e-live/mcp.spec.ts
  /api/v1/mcp/viewport/result:
    post:
      operationId: mcpViewportResult
      summary: The screen reports the result of a call
      tags:
      - MCP
      x-auth: Any signed-in account, and only for a call made for that same account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callId:
                  type: string
                ok:
                  type: boolean
                text:
                  type: string
                data: {}
              required:
              - callId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered:
                    type: boolean
        '404':
          description: 'noCall: that call is no longer waiting'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-proof: ui/e2e-live/mcp.spec.ts
  /api/v1/scim/settings/{domain}:
    get:
      operationId: scimSettingsGet
      summary: Does the domain have a provisioning token?
      tags:
      - SCIM
      x-auth: 'Whoever manages the domain: a server administrator, the organisation''s administrator,
        or the free-plan owner.'
      parameters:
      - name: domain
        in: path
        required: true
        description: Domain name.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:

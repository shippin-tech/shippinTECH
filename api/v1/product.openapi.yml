components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2 access token issued by `POST /auth/token`.
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using account name and secret.
    liveToken:
      type: apiKey
      in: query
      name: token
      description: A short-lived token (60 seconds) for event streams, where a browser cannot set an Authorization
        header.
    scimToken:
      type: http
      scheme: bearer
      description: A per-domain SCIM token made at `POST /api/v1/scim/settings/{domain}`. It reaches nothing
        outside that domain.
  responses:
    Problem:
      description: The request was refused; `error` is a short code, `message` plain words.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            type: object
            additionalProperties: true
    Forbidden:
      description: The account lacks the permission this call needs
      content:
        application/problem+json:
          schema:
            type: object
            additionalProperties: true
    NotFound:
      description: No such resource
      content:
        application/problem+json:
          schema:
            type: object
            additionalProperties: true
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            type: object
            additionalProperties: true
  schemas:
    Problem:
      type: object
      properties:
        error:
          type: string
          description: A short code such as notYourDomain.
        message:
          type: string
      required:
      - error
      - message
    ScimError:
      type: object
      additionalProperties: true
      description: A SCIM error (RFC 7644 section 3.12).
    ProductDocument:
      type: object
      additionalProperties: true
      description: 'See resources/product/api.json: product, prerelease, summary, reviewed, statuses,
        areas.'
    Organisation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domains:
          type: array
          items:
            type: string
        admins:
          type: array
          items:
            type: string
        maxPeople:
          type: integer
        maxStorage:
          type: integer
          description: Bytes.
        createdAt:
          type: integer
        people:
          type: integer
        storageHeld:
          type: integer
    OrgOverview:
      type: object
      properties:
        name:
          type: string
        me:
          type: string
        maxPeople:
          type: integer
        maxStorage:
          type: integer
        storageUsed:
          type: integer
        storageHeld:
          type: integer
        domains:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        people:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              email:
                type: string
              domainId:
                type: string
              fullName:
                type: string
              limit:
                type: integer
                nullable: true
              used:
                type: integer
              aliases:
                type: array
                items:
                  type: string
              teamIds:
                type: array
                items:
                  type: string
              admin:
                type: boolean
              protected:
                type: boolean
        teams:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              email:
                type: string
              domainId:
                type: string
              description:
                type: string
    DnsRecord:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        expected:
          type: string
        state:
          type: string
          enum:
          - found
          - different
          - missing
        actual:
          type: string
          nullable: true
    MaskedAddress:
      type: object
      properties:
        address:
          type: string
        accountId:
          type: integer
        label:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: integer
    AlertRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        metric:
          type: string
        window:
          type: string
          enum:
          - 1h
          - 24h
        above:
          type: boolean
          description: Fire above the threshold (true) or below it (false).
        threshold:
          type: number
        email:
          type: array
          items:
            type: string
        webhook:
          type: string
          nullable: true
        enabled:
          type: boolean
        cooldownMinutes:
          type: integer
        lastFired:
          type: integer
          nullable: true
        lastValue:
          type: number
          nullable: true
      required:
      - name
      - metric
      - window
      - above
      - threshold
    GoogleFile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        size:
          type: integer
          nullable: true
        modified:
          type: string
        webLink:
          type: string
        exports:
          type: array
          items:
            type: string
      description: Only what the screen shows, never Google's own payload.
    LessonProgress:
      type: object
      properties:
        done:
          type: array
          items:
            type: string
        dismissed:
          type: boolean
    Resources:
      type: object
      properties:
        server:
          type: object
          properties:
            host:
              type: string
            memory:
              type: number
            disk:
              type: object
              additionalProperties: true
            people:
              type: number
            domains:
              type: number
            queue:
              type: number
        orgs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              domains:
                type: array
                items:
                  type: string
              people:
                type: integer
              maxPeople:
                type: integer
              peopleLevel:
                type: string
              storageUsed:
                type: integer
              storageHeld:
                type: integer
              maxStorage:
                type: integer
              storageLevel:
                type: string
        other:
          type: object
          properties:
            domains:
              type: integer
            people:
              type: integer
            storageUsed:
              type: integer
    Stats:
      type: object
      properties:
        period:
          type: string
        start:
          type: integer
        step:
          type: integer
        points:
          type: integer
        since:
          type: integer
          nullable: true
        node:
          type: integer
          nullable: true
        nodes:
          type: integer
        nodeList:
          type: array
          items:
            type: object
            additionalProperties: true
        live:
          type: object
          additionalProperties:
            type: number
        history:
          type: object
          additionalProperties:
            type: object
            properties:
              kind:
                type: string
              values:
                type: array
                items:
                  type: number
                  nullable: true
              total:
                type: number
                nullable: true
              previous:
                type: number
                nullable: true
        descriptions:
          type: object
          additionalProperties:
            type: string
